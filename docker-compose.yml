version: "3.9"

services:
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build: .
    ports:
      - "${GATEWAY_PORT:-8080}:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - UPSTREAM_URL=http://mock_backend:8001
      - UPSTREAM_SERVER_1_URL=http://mock_backend:8001
      - UPSTREAM_SERVER_2_URL=http://mock_backend:8002
      - UPSTREAM_SERVER_3_URL=http://mock_backend:8003
      - UPSTREAM_SERVER_4_URL=http://mock_backend:8004
      - DEFAULT_LOAD_BALANCER_ALGORITHM=round_robin
      - DEFAULT_ACTIVE_SERVER_COUNT=4
      - ENV=production
    depends_on:
      redis:
        condition: service_healthy

  mock_backend:
    build: .
    command: python mock_backend.py
    expose:
      - "8001"
      - "8002"
      - "8003"
      - "8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 3



